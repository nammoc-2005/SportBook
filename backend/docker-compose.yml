version: '3.9'

services:
  # ── MySQL Database ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sportbook_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sportbook123}
      MYSQL_DATABASE: ${DB_NAME:-sportbook}
      MYSQL_USER: sportbook_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-sportbook123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-sportbook123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sportbook_net

  # ── Backend API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sportbook_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sportbook}
      DB_USER: ${DB_USER:-sportbook}
      DB_PASSWORD: ${DB_PASSWORD:-sportbook123}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      OTP_DEMO_MODE: ${OTP_DEMO_MODE:-false}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      BANK_ID: ${BANK_ID:-970436}
      BANK_ACCOUNT: ${BANK_ACCOUNT}
      ACCOUNT_NAME: ${ACCOUNT_NAME:-SPORTBOOK}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "5000:5000"
    volumes:
      # Uploads được lưu bên ngoài container, không mất khi rebuild
      - uploads_data:/app/uploads
    networks:
      - sportbook_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  sportbook_net:
    driver: bridge
